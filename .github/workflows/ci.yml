name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
  MPLBACKEND: Agg

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.4
      - run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 --index-url "$TORCH_INDEX_URL"
          pip install -r requirements.txt
      - name: Unit tests
        run: pytest -m "not slow" -q
      - name: End-to-end smoke tests (train -> promote -> predict, MLflow)
        run: pytest -m slow -q

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: housing-forecast:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image
        run: |
          docker run --rm housing-forecast:ci --help
          docker run --rm --entrypoint python housing-forecast:ci \
            -c "import housing_forecast.train, housing_forecast.promote, housing_forecast.predict, housing_forecast.api; print('ok')"

  airflow-dag:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: airflow/Dockerfile
          load: true
          tags: housing-forecast-airflow:ci
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,mode=max,scope=airflow
      - name: Validate DAG imports and structure
        run: |
          docker run --rm -e AIRFLOW__CORE__LOAD_EXAMPLES=False --entrypoint python housing-forecast-airflow:ci -c "
          from airflow.dag_processing.dagbag import DagBag
          bag = DagBag(dag_folder='/opt/airflow/dags')
          assert not bag.import_errors, bag.import_errors
          dag = bag.dags['housing_forecast_monthly']
          assert [t.task_id for t in dag.topological_sort()] == ['ingest', 'train', 'promote', 'predict']
          assert set(dag.params.keys()) == {'skip_ingest', 'force_promote'}
          print('DAG OK')
          "
          docker run --rm --entrypoint /opt/housing-forecast/bin/housing-forecast housing-forecast-airflow:ci --help
