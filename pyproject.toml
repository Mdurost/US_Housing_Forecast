[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "housing-forecast"
version = "0.1.0"
description = "12-month US state-level median listing price forecasts with a Temporal Fusion Transformer"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "requests>=2.31",
    "openpyxl>=3.1",
    "holidays>=0.50",
    "PyYAML>=6.0",
    "torch>=2.6",
    "lightning>=2.5",
    "pytorch-forecasting>=1.4",
    "pytorch-optimizer>=3.0",
    "tensorboard>=2.15",
    "mlflow>=3.0",
]

[project.optional-dependencies]
tune = ["optuna>=4.0", "optuna-integration>=4.0", "statsmodels>=0.14"]
api = ["fastapi>=0.110", "uvicorn>=0.30", "httpx>=0.27"]
notebooks = ["matplotlib>=3.8", "seaborn>=0.13", "ipykernel>=6.29"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
housing-forecast = "housing_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains a tiny model end to end (deselect with -m 'not slow')"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
